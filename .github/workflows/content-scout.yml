name: Content Scout

on:
  schedule:
    - cron: "0 6 * * *"      # daily fetch
    - cron: "0 7 * * 1"      # weekly full run (Mondays)
  workflow_dispatch:
    inputs:
      mode:
        description: "Scout mode"
        default: "full"
        type: choice
        options: [full, topic]
      propose:
        description: "Write proposals"
        type: boolean
        default: true

jobs:
  daily-fetch:
    if: github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run scout:fetch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(scout): daily fetch"

  weekly-run:
    if: github.event.schedule == '0 7 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run scout:run -- --propose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run content:validate
      - name: Open PR with scout results
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore(scout): weekly digest and proposals"
          body: |
            Automated Trend Scout run.
            Review digests under `content/scout/digests/` and proposals under `content/scout/proposals/`.
            Evergreen lessons are never auto-overwritten.
          branch: chore/scout-weekly
          commit-message: "chore(scout): weekly digest and proposals"
