        lessons:
          - { id: ag-evals, title: "Evals as CI & Observability", kind: living }
          - { id: ag-injection, title: "Prompt Injection Defense", kind: living }
          - { id: ag-budgets, title: "Cost/Latency Budgets & Human-in-the-Loop", kind: evergreen }
