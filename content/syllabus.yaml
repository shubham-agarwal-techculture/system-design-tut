      - id: inference-serving
        title: Inference Serving
        lessons:
          - { id: ti-batching, title: "Continuous Batching & Paged Attention", kind: living }
          - { id: ti-spec-quant, title: "Speculative Decoding & Quantization", kind: living }
          - { id: ti-fleet, title: "Multi-LoRA, Autoscaling & Cost/Token", kind: living }
      - id: llm-ops
        title: LLM Ops & Gateways
        lessons:
          - { id: ti-gateway, title: "LLM Gateways & Guardrails", kind: living }
          - { id: ti-model-ops, title: "Model Registries, A/B & Shadow Traffic", kind: living }

  - id: agentic-systems
