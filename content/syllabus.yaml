          - { id: ti-zero-fsdp, title: "ZeRO, FSDP & Checkpointing", kind: living }
          - { id: ti-collectives, title: "NCCL & Collective Communication", kind: living }
      - id: post-training
        title: Post-Training
        lessons:
          - { id: ti-finetune-lora, title: "Fine-Tuning & LoRA", kind: living }
